<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lequant</title>
<meta name="description" content="O futuro não é uma linha. É um leque. Em breve.">
<meta property="og:title" content="Lequant">
<meta property="og:description" content="O futuro não é uma linha. É um leque. Em breve.">
<meta name="theme-color" content="#f5f4f1">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preload" href="/fonts/SourceSerif4-SemiBold.ttf" as="font" type="font/ttf" crossorigin>
<style>
@font-face{font-family:"Source Serif 4";font-weight:400;font-display:swap;src:url("/fonts/SourceSerif4-Regular.ttf") format("truetype")}
@font-face{font-family:"Source Serif 4";font-weight:600;font-display:swap;src:url("/fonts/SourceSerif4-SemiBold.ttf") format("truetype")}
:root{
  color-scheme:light;
  --paper:#f5f4f1;--ink:#14181f;--blue:#2f5c8f;--blue-hover:#1d3d63;
  --muted:#5a5f68;--muted-2:#8b8f96;--hairline:#e2e0d9;
  --serif:"Source Serif 4",Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--blue);text-decoration:none}
a:hover{color:var(--blue-hover)}
a:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:2px}

header{position:relative;z-index:2;display:flex;align-items:baseline;gap:9px;padding:26px max(26px,calc((100vw - 1160px)/2 + 26px))}
.brand-name{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.brand-domain{font-size:11px;color:var(--muted-2);letter-spacing:.04em}

.hero{position:relative;flex:1;display:flex;align-items:center;justify-content:center;padding:40px 26px 80px;isolation:isolate}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-2;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 88%,transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 88%,transparent 100%)}
.veil{position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse 58% 52% at 50% 50%,var(--paper) 0%,rgba(245,244,241,.88) 46%,rgba(245,244,241,0) 78%)}
.content{text-align:center;display:flex;flex-direction:column;align-items:center}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--muted-2)}
.kicker i{width:6px;height:6px;border-radius:50%;background:var(--blue);animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,92,143,.45)}70%{box-shadow:0 0 0 7px rgba(47,92,143,0)}100%{box-shadow:0 0 0 0 rgba(47,92,143,0)}}
h1{font-family:var(--serif);margin:20px 0 0;font-size:clamp(36px,8.5vw,64px);line-height:1.04;letter-spacing:-.02em;font-weight:600;max-width:16ch;text-wrap:balance}
h1 em{font-style:normal;color:var(--blue)}
.sub{margin:20px auto 0;font-size:17px;line-height:1.5;color:var(--muted);max-width:40ch;text-wrap:pretty}
.contact{margin-top:30px;font-size:14px;color:var(--muted)}
.contact a{border-bottom:1px solid var(--hairline);padding-bottom:1px}
.contact a:hover{border-color:var(--blue-hover)}

footer{position:relative;z-index:2;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px;padding:18px max(26px,calc((100vw - 1160px)/2 + 26px)) 26px;border-top:1px solid var(--hairline);font-size:12.5px;color:var(--muted-2)}
footer a{color:var(--muted)}
.fade{opacity:0;transform:translateY(12px);animation:rise .9s cubic-bezier(.22,.7,.3,1) forwards}
.fade.d1{animation-delay:.15s}.fade.d2{animation-delay:.3s}.fade.d3{animation-delay:.45s}
@keyframes rise{to{opacity:1;transform:none}}
@media (max-width:640px){.veil{background:radial-gradient(ellipse 95% 38% at 50% 50%,var(--paper) 0%,rgba(245,244,241,.92) 55%,rgba(245,244,241,0) 85%)}.hero canvas{opacity:.75}}
@media (prefers-reduced-motion:reduce){.fade{animation:none;opacity:1;transform:none}.kicker i{animation:none}}
</style>
</head>
<body>
<header>
  <span class="brand-name">Lequant</span>
  <span class="brand-domain">lequant.eu</span>
</header>

<main class="hero">
  <canvas id="mc" aria-hidden="true"></canvas>
  <div class="veil"></div>
  <div class="content">
    <div class="kicker fade"><i></i>Em breve</div>
    <h1 class="fade d1">O futuro não é uma linha. <em>É um leque.</em></h1>
    <p class="sub fade d2">Estamos a preparar uma coisa nova. Para já, fica a ideia.</p>
    <p class="contact fade d3">Quer saber primeiro? <a href="mailto:contacto@lequant.eu?subject=Lequant">contacto@lequant.eu</a></p>
  </div>
</main>

<footer>
  <span>© 2026 Lequant</span>
  <span><a href="/taxacerta/">TaxaCerta</a> · <a href="/taxacerta/privacidade/">Política de Privacidade</a></span>
</footer>

<script>
"use strict";
// Hero canvas ported from the Lequant landing (landing/landing.js): Monte Carlo
// paths from a common origin, drawn as comets in perpetual motion; the pointer
// gently pushes them aside. No numbers, no axes.
(function(){
  var cv=document.getElementById("mc"); if(!cv||!cv.getContext) return;
  var reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var PAD=18, VMIN=-1.2, VMAX=5.4, START=2.15, T=150, CYCLE=8000, TAIL=18, FORCE=24;

  function randn(){var u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
  function makePaths(n){
    var theta=2.0,kappa=0.35,sigma=1.15,dt=10/(T-1),paths=[];
    for(var i=0;i<n;i++){var p=new Float32Array(T),v=START;p[0]=v;
      for(var t=1;t<T;t++){v+=kappa*(theta-v)*dt+sigma*Math.sqrt(dt)*randn();if(v<-1.1)v=-1.1+(-1.1-v)*0.3;p[t]=v}
      paths.push(p)}
    var med=new Float32Array(T),col=new Float64Array(n);
    for(var tt=0;tt<T;tt++){for(var j=0;j<n;j++)col[j]=paths[j][tt];var s=Array.prototype.slice.call(col).sort(function(a,b){return a-b});med[tt]=s[Math.floor(n/2)]}
    return {paths:paths,med:med};
  }
  var full=makePaths(1000), drawn=[];
  for(var i=0;i<full.paths.length;i+=8) drawn.push(full.paths[i]);
  var phases=drawn.map(function(){return Math.random()});

  var mouse={x:-999,y:-999,px:-999,py:-999,s:0,target:0}, wx=0, wy=0;
  addEventListener("pointermove",function(e){
    var r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    mouse.x=x;mouse.y=y;if(mouse.px<-900){mouse.px=x;mouse.py=y}
    mouse.target=(x>=0&&x<=r.width&&y>=0&&y<=r.height)?1:0;
  },{passive:true});
  function warp(x,y,push){
    wx=x;wy=y;if(push<=0.3)return;
    var dx=x-mouse.px,dy=y-mouse.py,d2=dx*dx+dy*dy;if(d2>=60000)return;
    var g=push*Math.exp(-d2/16000),inv=1/Math.sqrt(d2+900);wy=y+dy*inv*g;wx=x+dx*inv*g*0.3;
  }
  function fit(){
    var dpr=Math.min(2,devicePixelRatio||1),w=cv.clientWidth,h=cv.clientHeight;
    if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
    var ctx=cv.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);return {ctx:ctx,w:w,h:h};
  }
  function draw(t){
    var f=fit(); if(!f.w) return;
    var ctx=f.ctx,w=f.w,h=f.h;
    var X=function(i){return 6+i/(T-1)*(w-12)}, Y=function(v){return h-PAD-(v-VMIN)/(VMAX-VMIN)*(h-2*PAD)};
    ctx.lineWidth=0.6;ctx.strokeStyle="rgba(20,24,31,.045)";
    drawn.forEach(function(p){ctx.beginPath();for(var i=0;i<T;i++){if(i)ctx.lineTo(X(i),Y(p[i]));else ctx.moveTo(X(0),Y(p[0]))}ctx.stroke()});
    var push=FORCE*mouse.s;
    ctx.save();ctx.lineWidth=1.1;ctx.lineJoin="round";ctx.lineCap="round";
    drawn.forEach(function(p,j){
      var hn=reduced?(0.2+phases[j]*0.6):((t/CYCLE+phases[j])%1), head=hn*(T-1);
      var h0=Math.floor(head),fr=head-h0,s0=h0-TAIL,b0=s0+1>0?s0+1:0;
      ctx.strokeStyle="rgba(47,92,143,.32)";ctx.beginPath();
      for(var i=b0;i<=h0;i++){warp(X(i),Y(p[i]),push);if(i===b0)ctx.moveTo(wx,wy);else ctx.lineTo(wx,wy)}
      var i1=h0+1<T?h0+1:T-1;warp(X(head),Y(p[h0]+(p[i1]-p[h0])*fr),push);var hx=wx,hy=wy;ctx.lineTo(hx,hy);ctx.stroke();
      if(s0>=0&&fr<0.995){ctx.strokeStyle="rgba(47,92,143,"+(0.32*(1-fr)).toFixed(3)+")";ctx.beginPath();
        warp(X(s0),Y(p[s0]),push);ctx.moveTo(wx,wy);warp(X(s0+1),Y(p[s0+1]),push);ctx.lineTo(wx,wy);ctx.stroke()}
      ctx.fillStyle="rgba(47,92,143,.8)";ctx.beginPath();ctx.arc(hx,hy,1.7,0,7);ctx.fill();
    });
    ctx.restore();
    ctx.lineWidth=1.5;ctx.strokeStyle="rgba(47,92,143,.5)";ctx.beginPath();
    for(var k=0;k<T;k++){if(k)ctx.lineTo(X(k),Y(full.med[k]));else ctx.moveTo(X(0),Y(full.med[0]))}
    ctx.stroke();
  }
  if(reduced){ draw(0); addEventListener("resize",function(){draw(0)}); return; }
  var t0=performance.now(), raf=0, visible=!document.hidden;
  function tick(now){
    mouse.s+=(mouse.target-mouse.s)*0.16;mouse.px+=(mouse.x-mouse.px)*0.3;mouse.py+=(mouse.y-mouse.py)*0.3;
    draw(now-t0); raf=visible?requestAnimationFrame(tick):0;
  }
  document.addEventListener("visibilitychange",function(){visible=!document.hidden;if(visible&&!raf)raf=requestAnimationFrame(tick)});
  raf=requestAnimationFrame(tick);
})();
</script>
</body>
</html>
